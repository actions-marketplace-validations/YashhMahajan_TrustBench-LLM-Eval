[project]
name = "trustbench"
version = "0.1.0"
description = "Evaluate LLMs and LLM apps with statistics you can defend, a release gate, and a loop from production back to tests."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashh Mahajan" }]
keywords = ["llm", "evaluation", "ai-agents", "rag", "testing", "eval-driven-development", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "httpx>=0.28.1",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.20",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=42",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
redis = ["redis>=5"]

[project.urls]
Homepage = "https://github.com/YashhMahajan/TrustBench-LLM-Eval"
Documentation = "https://github.com/YashhMahajan/TrustBench-LLM-Eval/blob/main/docs/EDD.md"
Issues = "https://github.com/YashhMahajan/TrustBench-LLM-Eval/issues"
Changelog = "https://github.com/YashhMahajan/TrustBench-LLM-Eval/blob/main/CHANGELOG.md"

[project.scripts]
trustbench = "trustbench.cli:app"

[project.entry-points.pytest11]
trustbench = "trustbench.edd.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient", "error::pytest.PytestUnhandledThreadExceptionWarning"]

# Rules that find real bugs: unused names, late-binding closures, hidden exceptions, unsafe patterns.
# B008/B904/B905 are off on purpose: typer needs calls in defaults, the CLI and API turn errors into exit codes
# and HTTP answers, and our zip() calls pair lists that are built to be equal in length.
[tool.ruff.lint]
select = ["F", "B", "S", "E9"]
ignore = ["B008", "B904", "B905", "S101", "S311", "S110", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
